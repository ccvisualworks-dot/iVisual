body.services-page{background:#031713;}

.demo-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px;}
.demo-card{display:block;text-decoration:none;color:#fff;background:linear-gradient(145deg,rgba(10,38,31,.94),rgba(5,24,20,.9));border:1px solid rgba(92,232,175,.22);border-radius:24px;padding:14px;box-shadow:0 25px 70px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.035);position:relative;overflow:hidden;transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease;}
.demo-card::after{content:"";position:absolute;width:170px;height:170px;right:-90px;bottom:-90px;border-radius:50%;background:radial-gradient(circle,rgba(54,214,122,.22),transparent 70%);pointer-events:none;}
.demo-card:hover{transform:translateY(-7px);border-color:rgba(54,214,122,.62);box-shadow:0 30px 80px rgba(0,0,0,.42),0 0 34px rgba(54,214,122,.08);}

.demo-preview iframe{display:block;width:1280px;height:800px;border:0;transform:scale(.31);transform-origin:top left;pointer-events:none;background:#07110f;}
.demo-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 7px 5px;font-size:1.08rem;}
.demo-footer strong{font-size:1.08rem;}
.demo-arrow{width:34px;height:34px;display:grid;place-items:center;border:1px solid rgba(54,214,122,.55);border-radius:10px;color:#36d67a;font-size:1.2rem;flex:0 0 auto;}

<script>
document.addEventListener('DOMContentLoaded',()=>{
  const menu=document.querySelector('.menu'), nav=document.querySelector('.nav');
  if(menu&&nav){menu.addEventListener('click',()=>{const open=nav.classList.toggle('open');menu.setAttribute('aria-expanded',open)})}
  const robot=document.querySelector('.robot-bg'), sound=document.querySelector('.sound');
  if(robot&&sound){
    robot.playbackRate=.72; robot.muted=true; robot.volume=0;
    let timer;
    const fade=(to,done)=>{clearInterval(timer);const from=robot.volume,steps=12,delta=(to-from)/steps;let i=0;timer=setInterval(()=>{i++;robot.volume=Math.max(0,Math.min(1,from+delta*i));if(i>=steps){clearInterval(timer);robot.volume=to;if(done)done()}},30)};
    const off=()=>{fade(0,()=>{robot.muted=true;sound.textContent='🔊 Hear the robot';sound.setAttribute('aria-label','Hear the robot')})};
    sound.addEventListener('click',e=>{e.stopPropagation();if(robot.muted){robot.muted=false;robot.play().then(()=>fade(1,()=>{sound.textContent='🔇 Stop the robot voice';sound.setAttribute('aria-label','Stop the robot voice')})).catch(()=>off())}else off()});
    robot.addEventListener('click',off);
  }
  const form=document.querySelector('#enquiryForm');
  if(form)form.addEventListener('submit',e=>{e.preventDefault();const d=new FormData(form);const msg=`Hi iVisual.cc, I would like to enquire about a ${d.get('project')} project.%0A%0AName: ${encodeURIComponent(d.get('name'))}%0AEmail: ${encodeURIComponent(d.get('email'))}%0AProject details: ${encodeURIComponent(d.get('message'))}`;window.open('https://wa.me/60162818368?text='+msg,'_blank')});
});
</script></body></html>
